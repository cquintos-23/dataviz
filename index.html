      }

      // Select all shapes with the data-text attribute
      const shapes = svgElement.querySelectorAll("polygon[data-text], path[data-text], rect[data-text], circle[data-text]");

      console.log("Shapes found:", shapes.length); // Log the number of shapes

      // Add hover interactions to each shape
      shapes.forEach(shape => {
          shape.addEventListener("mouseenter", (event) => {
              tooltip.textContent = shape.getAttribute("data-text"); // Get the text from data-text attribute
              tooltip.style.display = "block"; // Show the tooltip
          });

          shape.addEventListener("mousemove", (event) => {
              tooltip.style.left = `${event.pageX + 10}px`; // Position the tooltip to follow the mouse
              tooltip.style.top = `${event.pageY + 10}px`;
          });

          shape.addEventListener("mouseleave", () => {
              tooltip.style.display = "none"; // Hide the tooltip when the mouse leaves the shape
          });
      });
});
    </script>
</body>
</html>
